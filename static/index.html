<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Invoice Parser</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      line-height: 1.5;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 0.5rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }

    .upload-zone p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .btn {
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .sample-select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .field-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.85rem;
    }

    .field-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .field-value {
      font-size: 1.15rem;
      font-weight: 600;
      word-break: break-all;
    }

    .confidence-bar-bg {
      background: #334155;
      height: 6px;
      border-radius: 3px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .confidence-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .conf-high { background-color: var(--success); }
    .conf-med { background-color: var(--warning); }
    .conf-low { background-color: var(--danger); }

    .warnings-panel {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
    }

    .warnings-panel h3 {
      font-size: 0.95rem;
      color: var(--warning);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .warnings-panel ul {
      list-style-position: inside;
      color: #fef3c7;
      font-size: 0.9rem;
    }

    pre {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.85rem;
      color: #38bdf8;
      max-height: 400px;
    }

    .meta-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      background: #334155;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Smart Invoice Parser</h1>
      <p>Digital PDF Header Field Extraction (100% Offline)</p>
    </header>

    <div class="card">
      <div id="dropZone" class="upload-zone">
        <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 0.5rem;">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p><strong>Click to browse</strong> or drag & drop a supplier invoice PDF</p>
        <p id="selectedFileName" style="color: var(--primary); margin-top: 0.5rem; font-weight: 500;"></p>
      </div>

      <div class="actions-row">
        <div>
          <button id="extractBtn" class="btn" disabled>Extract Fields</button>
        </div>
        <div>
          <span style="font-size: 0.85rem; color: var(--text-muted); margin-right: 0.5rem;">Sample:</span>
          <select id="sampleSelect" class="sample-select">
            <option value="">-- Choose Sample --</option>
            <option value="northwind_1042.pdf">Northwind Traders (UK)</option>
            <option value="kestrel_0311.pdf">Kestrel Components (US)</option>
            <option value="meridian_german.pdf">Meridian Industrial (DE)</option>
            <option value="unknown_vendor.pdf">Unknown Vendor (INR)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="statusAlert" style="display: none;" class="card"></div>

    <div id="resultsCard" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Extracted Invoice Fields</h2>
        <span id="latencyBadge" class="meta-tag">Latency: -- ms</span>
      </div>

      <div class="field-grid" id="fieldsGrid"></div>

      <div id="warningsBox" class="warnings-panel" style="display: none;">
        <h3>⚠️ Verification Warnings</h3>
        <ul id="warningsList"></ul>
      </div>

      <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <button id="toggleJsonBtn" class="btn btn-secondary" style="font-size: 0.85rem;">Toggle Raw JSON</button>
        <button id="copyJsonBtn" class="btn btn-secondary" style="font-size: 0.85rem;">Copy JSON</button>
      </div>
      <div id="rawJsonContainer" style="display: none; margin-top: 1rem;">
        <pre><code id="jsonOutput"></code></pre>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const extractBtn = document.getElementById('extractBtn');
    const selectedFileName = document.getElementById('selectedFileName');
    const sampleSelect = document.getElementById('sampleSelect');
    const resultsCard = document.getElementById('resultsCard');
    const fieldsGrid = document.getElementById('fieldsGrid');
    const warningsBox = document.getElementById('warningsBox');
    const warningsList = document.getElementById('warningsList');
    const jsonOutput = document.getElementById('jsonOutput');
    const rawJsonContainer = document.getElementById('rawJsonContainer');
    const toggleJsonBtn = document.getElementById('toggleJsonBtn');
    const copyJsonBtn = document.getElementById('copyJsonBtn');
    const latencyBadge = document.getElementById('latencyBadge');
    const statusAlert = document.getElementById('statusAlert');

    let currentFile = null;
    let latestResponseData = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    sampleSelect.addEventListener('change', async (e) => {
      const filename = e.target.value;
      if (!filename) return;
      try {
        const res = await fetch(`/samples/${filename}`);
        if (!res.ok) throw new Error('Sample not found');
        const blob = await res.blob();
        currentFile = new File([blob], filename, { type: 'application/pdf' });
        selectedFileName.textContent = `Selected Sample: ${filename} (${(blob.size / 1024).toFixed(1)} KB)`;
        extractBtn.disabled = false;
      } catch (err) {
        showStatus(`Error loading sample: ${err.message}`, true);
      }
    });

    function handleFileSelect(file) {
      if (!file.name.endsWith('.pdf')) {
        showStatus('Please upload a PDF document.', true);
        return;
      }
      currentFile = file;
      selectedFileName.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      extractBtn.disabled = false;
      statusAlert.style.display = 'none';
    }

    function showStatus(msg, isError) {
      statusAlert.style.display = 'block';
      statusAlert.style.color = isError ? 'var(--danger)' : 'var(--success)';
      statusAlert.textContent = msg;
    }

    extractBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      extractBtn.disabled = true;
      extractBtn.textContent = 'Extracting...';
      statusAlert.style.display = 'none';

      const formData = new FormData();
      formData.append('file', currentFile);

      const startTime = performance.now();
      try {
        const response = await fetch('/extract', {
          method: 'POST',
          body: formData
        });
        const latency = Math.round(performance.now() - startTime);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        latestResponseData = data;
        renderResults(data, latency);
      } catch (err) {
        showStatus(`Extraction failed: ${err.message}`, true);
      } finally {
        extractBtn.disabled = false;
        extractBtn.textContent = 'Extract Fields';
      }
    });

    function renderResults(data, latency) {
      latencyBadge.textContent = `Latency: ${latency} ms`;
      resultsCard.style.display = 'block';

      const fields = [
        { key: 'vendor', label: 'Vendor' },
        { key: 'invoice_number', label: 'Invoice Number' },
        { key: 'invoice_date', label: 'Invoice Date' },
        { key: 'due_date', label: 'Due Date' },
        { key: 'currency', label: 'Currency' },
        { key: 'subtotal', label: 'Subtotal' },
        { key: 'tax', label: 'Tax' },
        { key: 'total', label: 'Total' }
      ];

      fieldsGrid.innerHTML = fields.map(f => {
        const rawVal = data[f.key];
        const hasVal = rawVal !== null && rawVal !== undefined;
        let displayVal;
        if (!hasVal) {
          displayVal = '<span style="color: var(--text-muted); font-style: italic;">—</span>';
        } else if (typeof rawVal === 'number') {
          displayVal = rawVal.toFixed(2);
        } else {
          displayVal = String(rawVal);
        }
        const conf = data.confidence && data.confidence[f.key] !== undefined ? data.confidence[f.key] : 0.0;
        const pct = Math.round(conf * 100);
        let confClass = 'conf-low';
        if (conf >= 0.85) confClass = 'conf-high';
        else if (conf >= 0.60) confClass = 'conf-med';

        return `
          <div class="field-item">
            <div class="field-label">${f.label}</div>
            <div class="field-value">${displayVal}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; display: flex; justify-content: space-between;">
              <span>Confidence</span>
              <span>${pct}%</span>
            </div>
            <div class="confidence-bar-bg">
              <div class="confidence-bar-fill ${confClass}" style="width: ${pct}%;"></div>
            </div>
          </div>
        `;
      }).join('');

      if (data.warnings && data.warnings.length > 0) {
        warningsBox.style.display = 'block';
        warningsList.innerHTML = data.warnings.map(w => `<li>${w}</li>`).join('');
      } else {
        warningsBox.style.display = 'none';
      }

      jsonOutput.textContent = JSON.stringify(data, null, 2);
    }

    toggleJsonBtn.addEventListener('click', () => {
      rawJsonContainer.style.display = rawJsonContainer.style.display === 'none' ? 'block' : 'none';
    });

    copyJsonBtn.addEventListener('click', () => {
      if (latestResponseData) {
        navigator.clipboard.writeText(JSON.stringify(latestResponseData, null, 2));
        copyJsonBtn.textContent = 'Copied!';
        setTimeout(() => copyJsonBtn.textContent = 'Copy JSON', 1500);
      }
    });
  </script>
</body>
</html>
